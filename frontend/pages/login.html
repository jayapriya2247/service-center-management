<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ServiceCenter</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            Service<span>Center</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    🔐
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to access your Service Center dashboard.
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    document.getElementById("email")
                        .value
                        .trim();


                const password =
                    document.getElementById("password")
                        .value;


                loginMessage.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email,
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        loginMessage.textContent =
                            data.message ||
                            "Invalid email or password.";

                        return;
                    }


                    /*
                       Store authentication information
                       in browser localStorage
                    */

                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    loginMessage.textContent =
                        "Login successful!";


                    /*
                       Redirect to dashboard
                    */

                    setTimeout(function () {

                        window.location.href =
                            "dashboard.html";

                    }, 800);


                } catch (error) {

                    console.error(error);

                    loginMessage.textContent =
                        "Unable to connect to the server.";

                }

            }
        );

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - ServiceCenter</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="auth-page">

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            Service<span>Center</span>
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Register Section -->
    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    👤
                </div>

                <h1>Create Account</h1>

                <p>
                    Register to access the Service Center Management System.
                </p>

            </div>


            <!-- Register Form -->
            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role">

                        <option value="customer">
                            Customer
                        </option>

                        <option value="technician">
                            Technician
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>

        </div>

    </main>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const registerMessage =
            document.getElementById("registerMessage");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const role =
                    document.getElementById("role").value;


                registerMessage.textContent =
                    "Creating account...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name,
                                    email,
                                    password,
                                    role
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        registerMessage.textContent =
                            data.message ||
                            "Registration failed.";

                        return;
                    }


                    registerMessage.textContent =
                        "Account created successfully!";


                    registerForm.reset();


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1500);


                } catch (error) {

                    console.error(error);

                    registerMessage.textContent =
                        "Unable to connect to the server.";

                }

            }
        );

    </script>

</body>
</html>
